<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mugisha Agr Services | Blogu Rasmi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #1b5e20; --secondary: #2e7d32; --light: #f4f9f4; --wa: #25d366; --fb: #1877f2; --tg: #0088cc; --x: #000000; }
        body { font-family: 'Roboto', sans-serif; margin: 0; background: var(--light); color: #333; scroll-behavior: smooth; }
        
        header { background: var(--primary); color: white; padding: 30px 20px; text-align: center; cursor: pointer; position: relative; }
        .visitor-count { position: absolute; top: 10px; right: 10px; font-size: 12px; background: rgba(0,0,0,0.2); padding: 5px 10px; border-radius: 20px; }

        .container { max-width: 900px; margin: auto; padding: 20px; padding-bottom: 80px; }

        .weather-box { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        /* Admin Panel */
        #adminPanel { display: none; background: white; padding: 25px; border-radius: 15px; border: 3px solid var(--primary); margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-post { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-bottom: 10px; }

        /* Post Card */
        .post-card { background: white; border-radius: 15px; overflow: hidden; margin-bottom: 40px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); position: relative; }
        .post-media img, .post-media video { width: 100%; height: auto; max-height: 500px; object-fit: cover; }
        .post-content { padding: 25px; }
        .post-content h2 { color: var(--primary); margin: 0 0 15px 0; font-size: 26px; }
        .post-text { line-height: 1.8; font-size: 17px; white-space: pre-wrap; margin-bottom: 20px; }

        /* Share Buttons */
        .share-label { font-size: 13px; font-weight: bold; color: #666; margin-bottom: 10px; display: block; }
        .share-container { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; padding: 10px 0; border-top: 1px solid #eee; }
        .share-icon { width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; font-size: 16px; transition: 0.3s; }
        .share-icon:hover { transform: translateY(-3px); opacity: 0.8; }
        .bg-wa { background: var(--wa); } .bg-fb { background: var(--fb); } .bg-tg { background: var(--tg); } .bg-x { background: var(--x); } .bg-copy { background: #607d8b; }

        /* Home Button (REFIXED) */
        .home-btn { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 9999; border: none; cursor: pointer; text-decoration: none; }
        .home-btn:active { transform: scale(0.9); }

        .delete-btn { display: none; background: #ff4444; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 13px; margin-bottom: 15px; }

        .author-section { display: flex; align-items: center; background: #f9f9f9; padding: 15px; border-radius: 10px; margin-top: 20px; }
        .author-img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--primary); margin-right: 12px; }

        footer { text-align: center; padding: 30px; color: #666; font-size: 14px; }
    </style>
</head>
<body id="top">

<button class="home-btn" onclick="document.getElementById('top').scrollIntoView();" title="Rudi Juu">
    <i class="fas fa-home" style="font-size: 20px;"></i>
</button>

<header onclick="funguaAdmin()">
    <div class="visitor-count"><i class="fas fa-users"></i> Visitors: <span id="count">0</span></div>
    <h1>Mugisha Agr Services</h1>
    <p>Kilimo Biashara & Habari</p>
</header>

<div class="container">
    <div class="weather-box">
        <div><i class="fas fa-cloud-sun" style="color: orange; font-size: 24px;"></i> <b>Hali ya Hewa:</b> Tanzania</div>
        <div id="temp">29°C - Jua la Wastani</div>
    </div>

    <div id="adminPanel">
        <h3 style="margin-top:0;">Admin Mode</h3>
        <input type="text" id="postTitle" placeholder="Kichwa cha Habari...">
        <textarea id="postContent" rows="6" placeholder="Maelezo ya makala..."></textarea>
        <input type="text" id="mediaUrl" placeholder="Link ya Picha au Video (.jpg, .mp4)">
        <input type="text" id="youtubeUrl" placeholder="Link ya YouTube">
        <button class="btn-post" onclick="chapishaPost()">CHAPISHA SASA</button>
        <button class="btn-post" style="background:#666;" onclick="fungaAdmin()">ONDOKA ADMIN MODE</button>
    </div>

    <div id="postContainer">
        <p style="text-align:center;">Inapakia makala...</p>
    </div>
</div>

<footer><p>&copy; 2026 Mugisha Agr Services.</p></footer>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBSQ_oUvMBVXUOlB573I6cbxMsoGs0U8B0",
        authDomain: "mugisha-agr-services.firebaseapp.com",
        projectId: "mugisha-agr-services",
        storageBucket: "mugisha-agr-services.firebasestorage.app",
        messagingSenderId: "206696080160",
        appId: "1:206696080160:web:2405545d8cf850d88e2d45"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let isAdmin = false;

    function funguaAdmin() {
        if (prompt("Password:") === "020292") {
            isAdmin = true;
            document.getElementById('adminPanel').style.display = "block";
            document.querySelectorAll('.delete-btn').forEach(btn => btn.style.display = 'block');
            window.scrollTo(0,0);
        }
    }
    function fungaAdmin() { isAdmin = false; document.getElementById('adminPanel').style.display = "none"; }

    let v = localStorage.getItem('v') || 125;
    v = parseInt(v) + 1; localStorage.setItem('v', v);
    document.getElementById('count').innerText = v;

    db.collection("makala").orderBy("tarehe", "desc").onSnapshot((snapshot) => {
        const container = document.getElementById('postContainer');
        let html = "";
        snapshot.forEach((doc) => {
            const post = doc.data();
            const pid = doc.id;
            const pTitle = encodeURIComponent(post.kichwa);
            const pUrl = encodeURIComponent(window.location.href);
            
            let mediaHtml = post.mediaUrl ? `<div class="post-media">${post.mediaUrl.includes('.mp4') ? `<video controls src="${post.mediaUrl}"></video>` : `<img src="${post.mediaUrl}">`}</div>` : "";
            let youtubeHtml = post.youtubeUrl ? `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;margin-top:15px;border-radius:10px;"><iframe style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" src="${post.youtubeUrl.replace('watch?v=', 'embed/')}" allowfullscreen></iframe></div>` : "";

            html += `
                <div class="post-card">
                    ${mediaHtml}
                    <div class="post-content">
                        <button class="delete-btn" onclick="futaPost('${pid}')" style="display: ${isAdmin ? 'block' : 'none'}">Futa</button>
                        <h2>${post.kichwa}</h2>
                        <div class="post-text">${post.maelezo}</div>
                        ${youtubeHtml}
                        <span class="share-label">SAMBAZA ELIMU HII:</span>
                        <div class="share-container">
                            <a href="https://wa.me/?text=${pTitle}%20${pUrl}" target="_blank" class="share-icon bg-wa"><i class="fab fa-whatsapp"></i></a>
                            <a href="https://www.facebook.com/sharer/sharer.php?u=${pUrl}" target="_blank" class="share-icon bg-fb"><i class="fab fa-facebook-f"></i></a>
                            <a href="https://t.me/share/url?url=${pUrl}&text=${pTitle}" target="_blank" class="share-icon bg-tg"><i class="fab fa-telegram-plane"></i></a>
                            <a href="https://twitter.com/intent/tweet?text=${pTitle}&url=${pUrl}" target="_blank" class="share-icon bg-x"><i class="fab fa-x-twitter"></i></a>
                            <button onclick="navigator.clipboard.writeText(window.location.href); alert('Link imekopiwa!')" class="share-icon bg-copy"><i class="fas fa-link"></i></button>
                        </div>
                    </div>
                </div>`;
        });
        container.innerHTML = html;
    });

    async function futaPost(id) { if(confirm("Futa?")) await db.collection("makala").doc(id).delete(); }

    async function chapishaPost() {
        const t = document.getElementById('postTitle').value;
        const c = document.getElementById('postContent').value;
        const m = document.getElementById('mediaUrl').value;
        const y = document.getElementById('youtubeUrl').value;
        if(t && c) {
            await db.collection("makala").add({ kichwa: t, maelezo: c, mediaUrl: m, youtubeUrl: y, tarehe: firebase.firestore.FieldValue.serverTimestamp() });
            alert("Imechapishwa!"); location.reload();
        }
    }
</script>
</body>
</html>
