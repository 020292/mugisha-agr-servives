<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mugisha Agr Services | Blogu Rasmi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #1b5e20; --secondary: #2e7d32; --light: #f4f9f4; --wa: #25d366; --fb: #1877f2; }
        body { font-family: 'Roboto', sans-serif; margin: 0; background: var(--light); color: #333; scroll-behavior: smooth; }
        
        header { background: var(--primary); color: white; padding: 30px 20px; text-align: center; cursor: pointer; position: relative; }
        .visitor-count { position: absolute; top: 10px; right: 10px; font-size: 12px; background: rgba(0,0,0,0.2); padding: 5px 10px; border-radius: 20px; }

        .container { max-width: 900px; margin: auto; padding: 20px; padding-bottom: 80px; }

        /* Custom Login Box (Inachukua nafasi ya ile ya zamani) */
        #customLogin {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 100px rgba(0,0,0,0.5);
            z-index: 10001;
            width: 280px;
            text-align: center;
            border: 2px solid var(--primary);
        }
        #customLogin input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
        }
        #customLogin button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        /* Overlay background */
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10000; }

        /* Admin Panel */
        #adminPanel { display: none; background: white; padding: 25px; border-radius: 15px; border: 3px solid var(--primary); margin-bottom: 30px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-post { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Post Card */
        .post-card { background: white; border-radius: 15px; overflow: hidden; margin-bottom: 40px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .post-media img { width: 100%; height: auto; display: block; }
        .post-content { padding: 25px; }
        
        .delete-btn { display: none; background: #ff4444; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-bottom: 10px; }
        .home-btn { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 999; border: none; cursor: pointer; }

        .share-container { display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
        .share-icon { width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; }
    </style>
</head>
<body id="top">

<button class="home-btn" onclick="window.scrollTo(0,0)"><i class="fas fa-home"></i></button>

<!-- HAPA NDIO BOX JIPYA LA LOGIN LISILO NA JINA LA WEBSITE -->
<div id="overlay"></div>
<div id="customLogin">
    <h3 style="margin:0; color:var(--primary);">Admin Login</h3>
    <p style="font-size: 12px; color: #666;">Ingiza password yako kuendelea</p>
    <input type="password" id="passInput" placeholder="••••••">
    <button onclick="checkPassword()">INGIA</button>
    <p onclick="closeLogin()" style="color:red; cursor:pointer; font-size:11px; margin-top:10px;">Funga</p>
</div>

<header onclick="openLogin()">
    <div class="visitor-count"><i class="fas fa-users"></i> Visitors: <span id="count">0</span></div>
    <h1>Mugisha Agr Services</h1>
    <p>Kilimo Biashara & Habari</p>
</header>

<div class="container">
    <div id="adminPanel">
        <h3 style="margin-top:0;">Karibu Mugisha</h3>
        <input type="text" id="postTitle" placeholder="Kichwa cha Habari...">
        <textarea id="postContent" rows="5" placeholder="Maelezo ya makala..."></textarea>
        <input type="text" id="mediaUrl" placeholder="Link ya picha">
        <button class="btn-post" onclick="chapishaPost()">CHAPISHA</button>
        <button class="btn-post" style="background:#666; margin-top:5px;" onclick="location.reload()">LOGOUT</button>
    </div>

    <div id="postContainer"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBSQ_oUvMBVXUOlB573I6cbxMsoGs0U8B0",
        authDomain: "mugisha-agr-services.firebaseapp.com",
        projectId: "mugisha-agr-services",
        storageBucket: "mugisha-agr-services.firebasestorage.app",
        messagingSenderId: "206696080160",
        appId: "1:206696080160:web:2405545d8cf850d88e2d45"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let isAdmin = false;

    // Login functions
    function openLogin() {
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('customLogin').style.display = 'block';
        document.getElementById('passInput').focus();
    }

    function closeLogin() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('customLogin').style.display = 'none';
    }

    function checkPassword() {
        const p = document.getElementById('passInput').value;
        if(p === "020292") {
            isAdmin = true;
            closeLogin();
            document.getElementById('adminPanel').style.display = 'block';
            document.querySelectorAll('.delete-btn').forEach(b => b.style.display = 'block');
        } else {
            alert("Password Imekataa!");
            document.getElementById('passInput').value = "";
        }
    }

    // Visitor Counter
    let v = localStorage.getItem('v') || 131;
    v = parseInt(v) + 1; localStorage.setItem('v', v);
    document.getElementById('count').innerText = v;

    // Load Posts
    db.collection("makala").orderBy("tarehe", "desc").onSnapshot((snapshot) => {
        const container = document.getElementById('postContainer');
        let html = "";
        snapshot.forEach((doc) => {
            const post = doc.data();
            const pid = doc.id;
            const pTitle = encodeURIComponent(post.kichwa);
            const pUrl = encodeURIComponent(window.location.href);
            
            html += `
                <div class="post-card">
                    ${post.mediaUrl ? `<img src="${post.mediaUrl}">` : ''}
                    <div class="post-content">
                        <button class="delete-btn" onclick="futaPost('${pid}')" style="display: ${isAdmin ? 'block' : 'none'}">Futa</button>
                        <h2>${post.kichwa}</h2>
                        <div style="white-space:pre-wrap;">${post.maelezo}</div>
                        <div class="share-container">
                            <a href="https://wa.me/?text=${pTitle}%20${pUrl}" target="_blank" class="share-icon" style="background:#25d366"><i class="fab fa-whatsapp"></i></a>
                            <a href="https://www.facebook.com/sharer/sharer.php?u=${pUrl}" target="_blank" class="share-icon" style="background:#1877f2"><i class="fab fa-facebook-f"></i></a>
                        </div>
                    </div>
                </div>`;
        });
        container.innerHTML = html;
    });

    async function chapishaPost() {
        const t = document.getElementById('postTitle').value;
        const c = document.getElementById('postContent').value;
        const m = document.getElementById('mediaUrl').value;
        if(t && c) {
            await db.collection("makala").add({ kichwa: t, maelezo: c, mediaUrl: m, tarehe: firebase.firestore.FieldValue.serverTimestamp() });
            alert("Imechapishwa!");
            document.getElementById('postTitle').value = "";
            document.getElementById('postContent').value = "";
        }
    }

    async function futaPost(id) { if(confirm("Futa?")) await db.collection("makala").doc(id).delete(); }
</script>
</body>
</html>
