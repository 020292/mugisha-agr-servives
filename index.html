<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mugisha Agr Services | Elimu ya Kilimo</title>
    <style>
        body { font-family: 'Arial', sans-serif; margin: 0; padding: 0; background-color: #f0f4f0; }
        header { background-color: #1b5e20; color: white; padding: 30px; text-align: center; }
        .hero { background: #2e7d32; color: white; padding: 40px 20px; text-align: center; }
        .container { max-width: 900px; margin: 20px auto; padding: 15px; }
        
        /* Muonekano wa Makala (Kama ulivyotaka mwanzo) */
        .post-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 25px; border-top: 6px solid #2e7d32; }
        .post-card h2 { color: #1b5e20; margin-top: 0; font-size: 24px; }
        .post-card p { line-height: 1.6; color: #333; font-size: 17px; }
        .post-meta { font-size: 0.8em; color: #666; border-top: 1px solid #eee; padding-top: 10px; margin-top: 15px; }
        
        #loading { text-align: center; color: #2e7d32; font-weight: bold; margin-top: 50px; }
    </style>
</head>
<body>

<header>
    <h1>Mugisha Agr Services</h1>
    <p>Mshauri Wako wa Kilimo Biashara</p>
</header>

<div class="container">
    <div id="postContainer">
        <p id="loading">Tunapakia elimu ya kilimo...</p>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBSQ_oUvMBVXUOlB573I6cbxMsoGs0U8B0",
        authDomain: "mugisha-agr-services.firebaseapp.com",
        projectId: "mugisha-agr-services",
        storageBucket: "mugisha-agr-services.firebasestorage.app",
        messagingSenderId: "206696080160",
        appId: "1:206696080160:web:2405545d8cf850d88e2d45"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Kuonyesha makala tu (Bila sehemu ya kupost)
    db.collection("makala").orderBy("tarehe", "desc").onSnapshot((snapshot) => {
        const container = document.getElementById('postContainer');
        let html = "";
        
        if (snapshot.empty) {
            container.innerHTML = "<p style='text-align:center;'>Bado hakuna makala yoyote kwa sasa.</p>";
            return;
        }

        snapshot.forEach((doc) => {
            const post = doc.data();
            const tarehe = post.tarehe ? post.tarehe.toDate().toLocaleDateString('sw-TZ') : "Hivi punde";
            
            html += `
                <div class="post-card">
                    <h2>${post.kichwa}</h2>
                    <p>${post.maelezo}</p>
                    <div class="post-meta">Imechapishwa: ${tarehe} | Mugisha Agr Services</div>
                </div>
            `;
        });
        container.innerHTML = html;
    });
</script>

</body>
</html>
