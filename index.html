
<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mugisha Agr Services | Blogu ya Kilimo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f4; }
        header { background-color: #2e7d32; color: white; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 20px; }
        .container { max-width: 800px; margin: auto; }
        
        /* Sehemu ya Makala */
        #postContainer { margin-bottom: 40px; }
        .post-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; border-left: 5px solid #2e7d32; }
        .post-card h3 { color: #2e7d32; margin-top: 0; }
        
        /* Sehemu ya Admin */
        .admin-panel { background: #e8f5e9; padding: 25px; border-radius: 10px; border: 2px dashed #2e7d32; margin-top: 50px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #2e7d32; color: white; padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background-color: #1b5e20; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Mugisha Agr Services</h1>
        <p>Elimu ya Kilimo Biashara kwa Wakulima</p>
    </header>

    <!-- HAPA NDIPO MAKALA ZITAONEKANA -->
    <div id="postContainer">
        <p style="text-align: center;">Inapakia makala...</p>
    </div>

    <!-- HAPA NI SEHEMU YA ADMIN (WEWE TU NDIO UPAJUE) -->
    <div class="admin-panel">
        <h3>Admin: Chapisha Makala Mpya</h3>
        <input type="text" id="postTitle" placeholder="Kichwa cha habari (mf. Jinsi ya kupanda mahindi)">
        <textarea id="postContent" rows="5" placeholder="Andika maelezo ya kina hapa..."></textarea>
        <button onclick="chapishaPost()">Chapisha Makala Sasa</button>
    </div>
</div>

<!-- FIREBASE LIBRARIES -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    // Kodi zako za Firebase (Mugisha Agr Services)
    const firebaseConfig = {
        apiKey: "AIzaSyBSQ_oUvMBVXUOlB573I6cbxMsoGs0U8B0",
        authDomain: "mugisha-agr-services.firebaseapp.com",
        projectId: "mugisha-agr-services",
        storageBucket: "mugisha-agr-services.firebasestorage.app",
        messagingSenderId: "206696080160",
        appId: "1:206696080160:web:2405545d8cf850d88e2d45"
    };

    // Anzisha Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // KAZI YA 1: KUPATA MAKALA NA KUZIONYESHA
    db.collection("makala").orderBy("tarehe", "desc").onSnapshot((snapshot) => {
        const container = document.getElementById('postContainer');
        let html = "";
        
        if (snapshot.empty) {
            container.innerHTML = "<p style='text-align:center;'>Bado hakuna makala yoyote. Tumia fomu ya chini kuandika ya kwanza!</p>";
            return;
        }

        snapshot.forEach((doc) => {
            const post = doc.data();
            const tarehe = post.tarehe ? post.tarehe.toDate().toLocaleDateString('sw-TZ') : "Leo";
            
            html += `
                <div class="post-card">
                    <h3>${post.kichwa}</h3>
                    <p>${post.maelezo}</p>
                    <small style="color: #666;">Imechapishwa: ${tarehe}</small>
                </div>
            `;
        });
        container.innerHTML = html;
    });

    // KAZI YA 2: KUTUMA MAKALA KWENYE FIREBASE
    async function chapishaPost() {
        const title = document.getElementById('postTitle').value;
        const content = document.getElementById('postContent').value;
        const btn = document.querySelector('button');

        if (!title || !content) {
            alert("Mugisha, tafadhali jaza kichwa na maelezo!");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Inatuma...";

        try {
            await db.collection("makala").add({
                kichwa: title,
                maelezo: content,
                tarehe: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("Hongera! Makala imechapishwa vizuri.");
            document.getElementById('postTitle').value = "";
            document.getElementById('postContent').value = "";
        } catch (e) {
            alert("Kuna tatizo: " + e.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "Chapisha Makala Sasa";
        }
    }
</script>

</body>
</html>
